services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    expose:
      - "8000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=
    container_name: client
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=
    container_name: admin
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - client
      - admin
      - server
    restart: unless-stopped
