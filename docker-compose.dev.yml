services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: client
    ports:
      - "3000:5173"
    env_file:
      - ./client/.env
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    container_name: admin
    ports:
      - "3001:5174"
    env_file:
      - ./admin/.env
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - server
    restart: unless-stopped